[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.1.0"
description = "Production-grade RAG chatbot built module-by-module from the docs/ curriculum."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.75"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2.1"]
qdrant = ["qdrant-client>=1.12"]
local-models = ["sentence-transformers>=3.0", "transformers>=4.44"]
voyage = ["voyageai>=0.3"]
parsing = ["pypdf>=5.0", "beautifulsoup4>=4.12", "docling>=2.0"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
all = ["chatbot[anthropic,api,qdrant,parsing,redis,otel]"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "fastapi>=0.115",
  "httpx>=0.27",
]

[project.scripts]
chatbot = "chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["chatbot"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
